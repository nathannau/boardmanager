{% include 'overall_header.html' %}
<h2>{{ lang('BM2_ADDPLAYER_TITLE', BM2_TABLE_NAME) }}</h2>
<form method="post" class="bm2-form">
	<div class="panel">
		<div class="inner">
		{% if BM2_ERRORS %}<div class="bm2-errors">{% for error in BM2_ERRORS %}{{ error }}<br />{% endfor %}</div>{% endif %}
		<fieldset>
			<dl>
				<dt><label for="player">{{ lang('BM2_FIELD_PLAYER') }} :</label><br /><span>{{ lang('BM2_FIELD_PLAYER_EXPLAIN') }}</span></dt>
				<dd><input type="text" name="player" id="player" class="inputbox autowidth" value="{{ BM2_PLAYER }}" required /></dd>
			</dl>
		</fieldset>
		</div>
	</div>
	<fieldset class="submit-buttons">
		<a href="{{ U_BM2_BACK }}" class="button">{{ lang('CANCEL') }}</a>
		<input type="submit" name="submit" value="{{ lang('BM2_ADD') }}" class="button1" />
		{{ S_FORM_TOKEN }}
	</fieldset>
</form>
{% include 'overall_footer.html' %}
