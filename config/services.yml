parameters:
    nathannau.boardmanager2.tables.sessions: '%core.table_prefix%bm2_sessions'
    nathannau.boardmanager2.tables.tables: '%core.table_prefix%bm2_tables'
    nathannau.boardmanager2.tables.players: '%core.table_prefix%bm2_players'
    nathannau.boardmanager2.tables.discord_links: '%core.table_prefix%bm2_discord_links'
    nathannau.boardmanager2.tables.discord_codes: '%core.table_prefix%bm2_discord_codes'
    nathannau.boardmanager2.tables.discord_messages: '%core.table_prefix%bm2_discord_messages'

services:
    nathannau.boardmanager2.store:
        class: nathannau\boardmanager2\core\store
        arguments:
            - '@dbal.conn'
            - '%nathannau.boardmanager2.tables.sessions%'
            - '%nathannau.boardmanager2.tables.tables%'
            - '%nathannau.boardmanager2.tables.players%'

    nathannau.boardmanager2.rules:
        class: nathannau\boardmanager2\core\rules
        arguments:
            - '@nathannau.boardmanager2.store'
            - '@config_text'
            - '@dbal.conn'

    nathannau.boardmanager2.renderer:
        class: nathannau\boardmanager2\core\renderer
        arguments:
            - '@nathannau.boardmanager2.store'
            - '@nathannau.boardmanager2.rules'
            - '@controller.helper'
            - '@template'
            - '@user'
            - '@language'
            - '@dbal.conn'

    nathannau.boardmanager2.listener:
        class: nathannau\boardmanager2\event\listener
        arguments:
            - '@nathannau.boardmanager2.renderer'
            - '@symfony_request'
        tags:
            - { name: event.listener }

    nathannau.boardmanager2.poster:
        class: nathannau\boardmanager2\core\poster
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@auth'
            - '%core.root_path%'
            - '%core.php_ext%'

    nathannau.boardmanager2.actions:
        class: nathannau\boardmanager2\core\actions
        arguments:
            - '@nathannau.boardmanager2.store'
            - '@nathannau.boardmanager2.rules'
            - '@nathannau.boardmanager2.poster'
            - '@dbal.conn'
            - '@user'
            - '@auth'
            - '@language'

    nathannau.boardmanager2.main:
        class: nathannau\boardmanager2\controller\main
        arguments:
            - '@nathannau.boardmanager2.store'
            - '@nathannau.boardmanager2.rules'
            - '@nathannau.boardmanager2.renderer'
            - '@nathannau.boardmanager2.actions'
            - '@nathannau.boardmanager2.poster'
            - '@nathannau.boardmanager2.discord_sync'
            - '@dbal.conn'
            - '@user'
            - '@request'
            - '@template'
            - '@controller.helper'
            - '@language'
            - '%core.root_path%'
            - '%core.php_ext%'

    nathannau.boardmanager2.console.import_v1:
        class: nathannau\boardmanager2\console\import_v1
        arguments:
            - '@user'
            - '@dbal.conn'
            - '@nathannau.boardmanager2.store'
            - '@nathannau.boardmanager2.rules'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: console.command }

    nathannau.boardmanager2.discord_links:
        class: nathannau\boardmanager2\core\discord_links
        arguments:
            - '@dbal.conn'
            - '@cache.driver'
            - '%nathannau.boardmanager2.tables.discord_links%'
            - '%nathannau.boardmanager2.tables.discord_codes%'

    nathannau.boardmanager2.discord_api:
        class: nathannau\boardmanager2\core\discord_api
        arguments:
            - '@config'
            - '@config_text'

    nathannau.boardmanager2.discord:
        class: nathannau\boardmanager2\controller\discord
        arguments:
            - '@config'
            - '@symfony_request'
            - '@language'
            - '@user'
            - '@log'
            - '@nathannau.boardmanager2.discord_links'
            - '@dbal.conn'
            - '@nathannau.boardmanager2.actions'
            - '@nathannau.boardmanager2.rules'
            - '@nathannau.boardmanager2.store'
            - '@nathannau.boardmanager2.discord_panel'
            - '@nathannau.boardmanager2.discord_sync'

    nathannau.boardmanager2.console.discord_commands:
        class: nathannau\boardmanager2\console\discord_commands
        arguments:
            - '@user'
            - '@config'
            - '@nathannau.boardmanager2.discord_api'
        tags:
            - { name: console.command }

    nathannau.boardmanager2.discord_panel:
        class: nathannau\boardmanager2\core\discord_panel
        arguments:
            - '@nathannau.boardmanager2.rules'
            - '@nathannau.boardmanager2.renderer'
            - '@language'
            - '@dbal.conn'

    nathannau.boardmanager2.discord_sync:
        class: nathannau\boardmanager2\core\discord_sync
        arguments:
            - '@config'
            - '@nathannau.boardmanager2.discord_api'
            - '@nathannau.boardmanager2.discord_panel'
            - '@nathannau.boardmanager2.store'
            - '@nathannau.boardmanager2.rules'
            - '@dbal.conn'
            - '@log'
            - '%nathannau.boardmanager2.tables.discord_messages%'
            - '%nathannau.boardmanager2.tables.sessions%'

    nathannau.boardmanager2.cron.discord_sync:
        class: nathannau\boardmanager2\cron\discord_sync
        arguments:
            - '@config'
            - '@nathannau.boardmanager2.discord_sync'
        calls:
            - [set_name, [cron.task.nathannau.boardmanager2.discord_sync]]
        tags:
            - { name: cron.task }
