services:
    nathannau.boardmanager2.boardmanager:
        class: nathannau\boardmanager2\core\BoardManager
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@request'

    nathannau.boardmanager2.listener:
        class: nathannau\boardmanager2\events\bbcode_listener
        arguments:
            - '@nathannau.boardmanager2.boardmanager'
        tags:
            - { name: event.listener }

    nathannau.boardmanager2.main:
        class: nathannau\boardmanager2\controller\main
        arguments:
            - '@nathannau.boardmanager2.boardmanager'
            - '@dbal.conn'
            - '@user'
            - '@request'
            - '@template'
            #- '@form.factory'
            
