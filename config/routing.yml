nathannau_boardmanager2_configure:
    path: /boardmanager2/configure/{topic}
    defaults: { _controller: nathannau.boardmanager2.main:configure }
    requirements:
        topic: \d+
nathannau_boardmanager2_open:
    path: /boardmanager2/open/{session}
    defaults: { _controller: nathannau.boardmanager2.main:open }
    requirements:
        session: \d+
nathannau_boardmanager2_edit:
    path: /boardmanager2/edit/{table}
    defaults: { _controller: nathannau.boardmanager2.main:edit }
    requirements:
        table: \d+
nathannau_boardmanager2_register:
    path: /boardmanager2/register/{session}/{table}
    defaults: { _controller: nathannau.boardmanager2.main:register }
    requirements:
        session: \d+
        table: \d+
nathannau_boardmanager2_unregister:
    path: /boardmanager2/unregister/{session}/{table}
    defaults: { _controller: nathannau.boardmanager2.main:unregister }
    requirements:
        session: \d+
        table: \d+
nathannau_boardmanager2_cancel:
    path: /boardmanager2/cancel/{table}
    defaults: { _controller: nathannau.boardmanager2.main:cancel }
    requirements:
        table: \d+
nathannau_boardmanager2_addplayer:
    path: /boardmanager2/addplayer/{table}
    defaults: { _controller: nathannau.boardmanager2.main:addplayer }
    requirements:
        table: \d+
nathannau_boardmanager2_validate:
    path: /boardmanager2/validate/{player}
    defaults: { _controller: nathannau.boardmanager2.main:validate }
    requirements:
        player: \d+
nathannau_boardmanager2_removeplayer:
    path: /boardmanager2/removeplayer/{player}
    defaults: { _controller: nathannau.boardmanager2.main:removeplayer }
    requirements:
        player: \d+
